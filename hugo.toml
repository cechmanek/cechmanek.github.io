baseURL = 'https://cechmanek.github.io/'
locale = 'en-us'
title = 'Justin Cechmanek'
defaultContentLanguage = 'en'
enableEmoji = true

[module]
  [[module.imports]]
    path = 'github.com/hugo-toha/toha/v4'

  [[module.mounts]]
    source = 'static/files'
    target = 'static/files'
  [[module.mounts]]
    source = './node_modules/flag-icons/flags'
    target = 'static/flags'
  [[module.mounts]]
    source = './node_modules/@fontsource/mulish/files'
    target = 'static/files'
  [[module.mounts]]
    source = './node_modules/katex/dist/fonts'
    target = 'static/fonts'

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 6
  ordered = false

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params]
  background = '/images/site/background.jpg'
  darkBackground = '/images/site/background-dark.jpg'
  gitRepo = 'https://github.com/cechmanek/cechmanek.github.io'
  gitBranch = 'hugo/main'

[params.logo]
  favicon = '/images/site/favicon.png'

[params.topNavbar]
  maxVisibleSections = 6

[params.features.theme]
  enable = true
[params.features.theme.services]
  light = true
  dark = true
  default = 'system'

[params.features.portfolio]
  enable = true

[params.features.blog]
  enable = true
  showAuthor = true
[params.features.blog.shareButtons]
  twitter = true
  linkedin = true
  email = true

[params.features.comment]
  enable = false

[params.features.toc]
  enable = true

[params.features.tags]
  enable = true
  on_card = true

[params.features.readingTime]
  enable = false

[params.features.pagination]
  maxPostsPerPage = 12

[params.footer]
  enable = true
[params.footer.navigation]
  enable = true
  customMenus = true
[params.footer.contactMe]
  enable = true
[params.footer.credentials]
  enable = true
[params.footer.newsletter]
  enable = false
