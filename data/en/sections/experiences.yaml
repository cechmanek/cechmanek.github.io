experiences:
- company:
    name: Redis
    url: "https://redis.io"
    location: Seattle, Washington
    logo: /images/sections/experiences/redis.png
    overview: Redis builds the real-time data platform powering the AI and agent economy. I lead applied AI work on RedisVL, the Redis Vector Library.
  positions:
  - designation: Senior Applied AI Engineer
    start: 2024
    responsibilities:
    - Build and maintain [RedisVL](https://github.com/redis/redis-vl), the open-source Redis Vector Library for LLM and agentic-AI workloads.
    - Design semantic caching, semantic routing, and conversational/agent memory abstractions on Redis.
    - Contribute to Redis Agent Memory Server and integrations with LangChain, LangGraph, LlamaIndex, and NVIDIA NeMo.
    - Co-author research on [semantic caching for LLMs](https://arxiv.org/abs/2504.02268).

